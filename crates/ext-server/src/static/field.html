<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>场可视化 · field-memory</title>
  <link rel="stylesheet" href="field.css">
</head>
<body>

<!-- ── Top bar ────────────────────────────────────── -->
<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    场可视化
    <span class="sub">field-memory · 3d</span>
  </div>
  <div class="stats" id="stats">
    <div class="item"><span class="lbl">anchors</span><span class="val" id="stat-anchors">—</span></div>
    <div class="sep">·</div>
    <div class="item"><span class="lbl">events</span><span class="val" id="stat-events">—</span></div>
    <div class="sep">·</div>
    <div class="item"><span class="lbl">tension</span><span class="val" id="stat-tension">—</span></div>
    <div class="sep">·</div>
    <div class="item"><span class="lbl">library</span><span class="val" id="stat-lib">—</span></div>
  </div>
  <div class="spacer"></div>
  <a href="/" class="btn">↩ 返回主页</a>
  <button class="btn primary" id="btn-reset-cam">重置视角</button>
</header>

<!-- ── App body ──────────────────────────────────── -->
<div class="app">

  <!-- Left: filters -->
  <aside class="panel-left collapsible" id="panel-left-field">
    <button class="field-panel-toggle" style="right:-14px" title="折叠面板">‹</button>

    <div class="section">
      <h3>投影</h3>
      <div class="mode-row" id="proj-mode">
        <button class="mode-btn active" data-mode="pca">PCA · 3D</button>
        <button class="mode-btn" data-mode="first3">首 3 维</button>
      </div>
    </div>

    <div class="section">
      <h3>层级</h3>
      <div class="layers" id="layers">
        <label class="layer-row" data-layer="L1">
          <input type="checkbox" checked>
          <span class="layer-swatch" style="background:var(--l1); color:var(--l1)"></span>
          <span class="layer-name">L1 · 核心 (d > 15)</span>
          <span class="layer-count">0</span>
        </label>
        <label class="layer-row" data-layer="L2">
          <input type="checkbox" checked>
          <span class="layer-swatch" style="background:var(--l2); color:var(--l2)"></span>
          <span class="layer-name">L2 · 强 (d > 8)</span>
          <span class="layer-count">0</span>
        </label>
        <label class="layer-row" data-layer="L3">
          <input type="checkbox" checked>
          <span class="layer-swatch" style="background:var(--l3); color:var(--l3)"></span>
          <span class="layer-name">L3 · 中 (d > 3)</span>
          <span class="layer-count">0</span>
        </label>
        <label class="layer-row" data-layer="L4">
          <input type="checkbox" checked>
          <span class="layer-swatch" style="background:var(--l4); color:var(--l4)"></span>
          <span class="layer-name">L4 · 弱 (d ≤ 3)</span>
          <span class="layer-count">0</span>
        </label>
      </div>
    </div>

    <div class="section">
      <h3>连接</h3>
      <div class="slider-block">
        <div class="slider-header">
          <span class="slider-label">相似度阈值</span>
          <span class="slider-value" id="sim-val">0.30</span>
        </div>
        <input type="range" id="sim-slider" min="0" max="1" step="0.01" value="0.30">
      </div>
    </div>

    <div class="section">
      <h3>密度范围</h3>
      <div class="range-pair">
        <div class="slider-block">
          <div class="slider-header">
            <span class="slider-label">最小</span>
            <span class="slider-value" id="dmin-val">0</span>
          </div>
          <input type="range" id="dmin-slider" min="0" max="60" step="1" value="0">
        </div>
        <div class="slider-block">
          <div class="slider-header">
            <span class="slider-label">最大</span>
            <span class="slider-value" id="dmax-val">60</span>
          </div>
          <input type="range" id="dmax-slider" min="0" max="60" step="1" value="60">
        </div>
      </div>
    </div>

    <div class="section">
      <h3>显示</h3>
      <div class="toggle on" id="t-labels">
        <span class="toggle-label">锚点标签</span>
        <div class="toggle-switch"></div>
      </div>
      <div class="toggle on" id="t-connections">
        <span class="toggle-label">连接线</span>
        <div class="toggle-switch"></div>
      </div>
      <div class="toggle" id="t-grid">
        <span class="toggle-label">参考网格</span>
        <div class="toggle-switch"></div>
      </div>
      <div class="toggle" id="t-stars">
        <span class="toggle-label">背景星点</span>
        <div class="toggle-switch"></div>
      </div>
    </div>

  </aside>

  <!-- Center: 3D canvas -->
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div class="hud" id="hud">
      <div><span class="lbl">camera · </span><span class="val" id="hud-cam">0, 0, 12</span></div>
      <div><span class="lbl">fps · </span><span class="val" id="hud-fps">—</span></div>
      <div><span class="lbl">visible · </span><span class="val" id="hud-vis">0 锚点 / 0 连线</span></div>
    </div>
  </div>

  <!-- Right: details -->
  <aside class="panel-right collapsible" id="panel-right-field">
    <button class="field-panel-toggle" style="left:-14px" title="折叠面板">›</button>
    <div class="section">
      <h3>锚点详情</h3>
      <div id="detail-body">
        <div class="detail-empty">
          <div class="ico"></div>
          <div class="msg">点击画布中的锚点<br>查看其参数与关联</div>
        </div>
      </div>
    </div>
  </aside>
</div>

<!-- ── Bottom legend ─────────────────────────────── -->
<footer class="bottombar">
  <span class="legend-item"><span class="legend-swatch" style="background:var(--l1); box-shadow:0 0 6px var(--l1)"></span>L1</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--l2); box-shadow:0 0 6px var(--l2)"></span>L2</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--l3); box-shadow:0 0 6px var(--l3)"></span>L3</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--l4); box-shadow:0 0 6px var(--l4)"></span>L4</span>
  <span class="legend-item" style="margin-left: 16px; color: var(--text-faint)">球体大小 ∝ √density　·　线条透明度 ∝ 相似度</span>
  <span style="flex:1"></span>
  <span class="hints">
    <kbd>drag</kbd> 旋转 · <kbd>scroll</kbd> 缩放 · <kbd>right-drag</kbd> 平移 · <kbd>click</kbd> 选中
  </span>
</footer>

<!-- ── Three.js + app ─────────────────────────────── -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="field.js"></script>
</body>
</html>
