<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>field-memory 控制台</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #f5f4f0; --surface: #fff; --text: #1a1a1a; --text-muted: #6b6b6b;
  --user-bubble: #e8edf4; --border: #e0ddd8; --font: -apple-system, system-ui, sans-serif;
  --accent: #4a6fa5; --tag-bg: #eef2f7; --panel-bg: #fafaf8;
  --col-left: 260px; --col-right: 320px;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100dvh; overflow:hidden; display:flex; flex-direction:column; }
header { flex-shrink:0; padding:8px 16px; border-bottom:1px solid var(--border); background:var(--surface); display:flex; align-items:center; gap:8px; flex-wrap:wrap; z-index:10; }
header h1 { font-size:14px; font-weight:600; margin-right:auto; }
header input, header select { font-size:12px; padding:4px 8px; border:1px solid var(--border); border-radius:6px; background:var(--surface); font-family:var(--font); }
header input[type="text"], header input[type="password"] { width:100px; }
header .hdr-btn { font-size:11px; padding:4px 10px; border:1px solid var(--border); border-radius:5px; background:var(--surface); color:var(--text); cursor:pointer; font-family:var(--font); }
header .hdr-btn:hover { background:var(--bg); }
header .hdr-btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }

/* ── three-column layout ── */
#columns { flex:1; display:flex; overflow:hidden; min-height:0; }

/* left panel */
#panel-core { width:var(--col-left); flex-shrink:0; overflow-y:auto; background:var(--panel-bg); border-right:1px solid var(--border); padding:12px; font-size:11px; }
#panel-core h3 { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin:12px 0 6px; }
#panel-core h3:first-child { margin-top:0; }
.pc-row { display:flex; justify-content:space-between; padding:2px 0; }
.pc-row .l { color:var(--text-muted); }
.pc-row .v { font-weight:500; font-variant-numeric:tabular-nums; }
.pc-seed { padding:3px 0; border-top:1px solid var(--border); font-size:10px; color:var(--text-muted); }
.pc-activity { padding:3px 0; border-top:1px solid var(--border); font-size:10px; line-height:1.4; }

/* right panel */
#panel-mem { width:var(--col-right); flex-shrink:0; overflow-y:auto; background:var(--panel-bg); border-left:1px solid var(--border); padding:12px; font-size:11px; }
#panel-mem h3 { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin:12px 0 6px; }
#panel-mem h3:first-child { margin-top:0; }
.pm-row { display:flex; justify-content:space-between; padding:2px 0; }
.pm-row .l { color:var(--text-muted); }
.pm-row .v { font-weight:500; font-variant-numeric:tabular-nums; }

/* library selector */
.lib-row { display:flex; gap:4px; align-items:center; margin:4px 0 8px; }
.lib-row select { flex:1; font-size:11px; padding:3px 6px; border:1px solid var(--border); border-radius:4px; background:var(--surface); font-family:var(--font); }
.lib-row button { font-size:10px; padding:3px 6px; border:1px solid var(--border); border-radius:4px; background:var(--surface); color:var(--text); cursor:pointer; }
.lib-row button:hover { background:var(--bg); }

/* ── Field visualization canvas ── */
.field-viz-wrap {
  position: relative; width:100%; aspect-ratio:1; background:#0e1116;
  border-radius:8px; overflow:hidden; margin:6px 0;
  box-shadow: inset 0 0 24px rgba(74, 111, 165, 0.2);
}
.field-viz-canvas { display:block; width:100%; height:100%; }
.field-viz-overlay {
  position:absolute; top:6px; right:8px; font-size:9px; color:rgba(255,255,255,0.5);
  text-align:right; line-height:1.3; pointer-events:none;
}

/* anchor density bars */
.pm-anchor { display:flex; align-items:center; gap:4px; padding:2px 0; }
.pm-anchor .lbl { flex-shrink:0; min-width:50px; max-width:70px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pm-anchor .bar { flex:1; height:5px; background:var(--bg); border-radius:3px; overflow:hidden; }
.pm-anchor .bar .fill { height:100%; background:#6b6b6b; border-radius:3px; }
.pm-anchor .val { width:30px; text-align:right; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.pm-event { padding:3px 0; border-top:1px solid var(--border); font-size:10px; color:var(--text-muted); line-height:1.4; }
.pm-event .e-txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pm-event .e-ts { font-size:9px; color:#999; }
.ecg-bar { display:flex; align-items:flex-end; gap:2px; height:28px; margin:4px 0; }
.ecg-bar .col { width:6px; background:var(--accent); border-radius:2px 2px 0 0; min-height:1px; opacity:.6; }
.pm-actions { display:flex; gap:4px; flex-wrap:wrap; margin:6px 0; }
.pm-actions button { font-size:10px; padding:3px 8px; border:1px solid var(--border); border-radius:4px; background:var(--surface); color:var(--text); cursor:pointer; }
.pm-actions button:hover { background:var(--bg); }

/* chat */
#panel-chat { flex:1; display:flex; flex-direction:column; min-width:0; }
#messages { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:12px; }
#input-area { flex-shrink:0; padding:12px 20px 16px; background:var(--surface); border-top:1px solid var(--border); display:flex; gap:8px; align-items:flex-end; }
#input-area textarea { width:100%; resize:none; border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-size:14px; font-family:var(--font); line-height:1.5; background:var(--surface); color:var(--text); outline:none; }
#input-area textarea:focus { border-color:#888; }
#input-area textarea::placeholder { color:#aaa; }
#input-area button { width:36px; height:36px; border-radius:8px; border:none; background:#1a1a1a; color:#fff; cursor:pointer; font-size:13px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
#input-area button:hover { opacity:.85; }
#input-area button:disabled { opacity:.4; cursor:default; }
.message { display:flex; flex-direction:column; max-width:80%; animation:fadeIn .2s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.message.user { align-self:flex-end; }
.message.assistant { align-self:flex-start; }
.message .content { padding:10px 14px; border-radius:10px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.message.user .content { background:var(--user-bubble); color:var(--text); border-bottom-right-radius:3px; }
.message.assistant .content { background:transparent; color:var(--text); padding-left:0; }
.message .meta { font-size:10px; color:var(--text-muted); margin-top:3px; padding:0 3px; }
.message.user .meta { text-align:right; }
.typing .content { color:var(--text-muted) !important; }
.welcome { align-self:center; text-align:center; color:var(--text-muted); margin-top:8vh; font-size:13px; line-height:1.8; }
.welcome strong { color:var(--text); font-weight:500; }

.mem-ctx-toggle { font-size:10px; color:var(--text-muted); cursor:pointer; padding:2px 3px; margin-top:2px; display:inline-flex; align-items:center; gap:4px; user-select:none; }
.mem-ctx-toggle::before { content:"\25B6"; font-size:8px; transition:transform .15s; display:inline-block; }
.mem-ctx-toggle.open::before { transform:rotate(90deg); }
.mem-ctx-detail { font-size:11px; color:var(--text-muted); background:var(--tag-bg); border-radius:6px; padding:8px 10px; margin-top:4px; line-height:1.6; display:none; border:1px solid var(--border); }
.mem-ctx-detail.open { display:block; }
.mem-ctx-detail .label { color:var(--accent); font-weight:500; }
.mem-ctx-detail .item { padding:1px 0; }

/* ── session sidebar ── */
#session-sidebar {
  width: 200px; flex-shrink:0; overflow-y:auto; background:var(--panel-bg);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
}
#session-sidebar .sb-header {
  padding:10px 10px 6px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border);
}
#session-sidebar .sb-header h3 {
  font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin:0;
}
#session-sidebar .sb-new {
  width:20px; height:20px; border:1px solid var(--border); border-radius:4px;
  background:var(--surface); color:var(--text-muted); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:13px; line-height:1;
}
#session-sidebar .sb-new:hover { background:var(--bg); color:var(--text); }
#session-list { flex:1; overflow-y:auto; padding:4px 0; }
.sb-item {
  padding:7px 10px; cursor:pointer; font-size:12px; color:var(--text-muted);
  display:flex; align-items:center; justify-content:space-between; gap:4px;
  border-left:2px solid transparent; transition:background .1s, border-color .1s;
}
.sb-item:hover { background:rgba(0,0,0,.03); }
.sb-item.active { background:var(--tag-bg); color:var(--text); border-left-color:var(--accent); font-weight:500; }
.sb-item .sb-label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sb-item .sb-del {
  width:16px; height:16px; border:none; background:transparent; color:var(--text-muted);
  cursor:pointer; font-size:11px; border-radius:3px; display:none; align-items:center; justify-content:center;
  flex-shrink:0; opacity:.6;
}
.sb-item:hover .sb-del { display:flex; }
.sb-item .sb-del:hover { background:rgba(0,0,0,.08); opacity:1; color:#c0392b; }

/* ── slash command popover ── */
.cmd-popover {
  position:absolute; bottom:100%; left:0; right:0; max-height:240px; overflow-y:auto;
  background:var(--surface); border:1px solid var(--border); border-radius:8px;
  box-shadow:0 4px 16px rgba(0,0,0,.08); padding:4px 0; z-index:20; display:none;
}
.cmd-popover.open { display:block; }
.cmd-item {
  padding:8px 14px; cursor:pointer; font-size:13px; display:flex; align-items:baseline; gap:8px;
  transition:background .1s;
}
.cmd-item:hover, .cmd-item.selected { background:var(--tag-bg); }
.cmd-item .cmd-name { font-weight:500; color:var(--text); white-space:nowrap; }
.cmd-item .cmd-alias { font-size:10px; color:var(--text-muted); }
.cmd-item .cmd-desc { font-size:11px; color:var(--text-muted); flex:1; text-align:right; }

@media (max-width: 1000px) {
  #session-sidebar { width:160px; }
  #panel-core { display:none; }
  #panel-mem { width:260px; }
}
@media (max-width: 700px) { #session-sidebar { display:none; } #panel-mem { display:none; } }
</style>
</head>
<body>
<header>
  <h1>field-memory</h1>
  <select id="lib-select" onchange="onLibraryChange(this.value)"></select>
  <button class="hdr-btn" onclick="showLibraryDialog()">管理</button>
  <select id="model-select"><option>test-model-1</option><option>test-model-2</option></select>
  <input id="api-key" type="password" placeholder="API Key" value="sk-fm">
  <input id="backend-url" type="text" placeholder="代理地址" value="http://127.0.0.1:5100">
</header>

<div id="columns">
  <div id="session-sidebar">
    <div class="sb-header">
      <h3>会话</h3>
      <button class="sb-new" onclick="createSession()" title="新会话">+</button>
    </div>
    <div id="session-list"></div>
  </div>
  <div id="panel-core"></div>
  <div id="panel-chat">
    <div id="messages">
      <div class="welcome">
        <strong>field-memory</strong><br>
        库选择器在 header &middot; 记忆场可视化在右栏 &middot; 聊天在中栏
      </div>
    </div>
    <div id="input-area">
      <div style="flex:1;position:relative;">
        <textarea id="user-input" rows="1" placeholder="/help 查看命令  或直接聊天..." onkeydown="handleKey(event)" oninput="onInputChange()"></textarea>
        <div id="cmd-popover" class="cmd-popover"></div>
      </div>
      <button id="send-btn" onclick="send()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="2" y1="8" x2="14" y2="8"/><polyline points="10,4 14,8 10,12"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="panel-mem"></div>
</div>

<script>
var isStreaming = false, pollTimer = null;
var currentLibrary = 'default';
var lastAnchors = [];
var fieldParticles = [];
var fieldTension = 0;
var lastAnchorCount = 0;

// ── Session management ──
var sessions = [];
var activeSessionId = null;

function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function createSession() {
  var id = generateId();
  var s = { id: id, title: '新会话', messages: [], createdAt: Date.now() };
  sessions.unshift(s);
  switchSession(id);
  renderSessionList();
  document.getElementById('user-input').focus();
}

function switchSession(id) {
  activeSessionId = id;
  renderSessionList();
  renderChatMessages();
  document.getElementById('user-input').focus();
}

function deleteSession(id) {
  sessions = sessions.filter(function(s) { return s.id !== id; });
  if (activeSessionId === id) {
    if (sessions.length === 0) createSession();
    else switchSession(sessions[0].id);
  } else {
    renderSessionList();
  }
}

function getActiveSession() {
  return sessions.find(function(s) { return s.id === activeSessionId; });
}

function renderSessionList() {
  var list = document.getElementById('session-list');
  var html = '';
  for (var i = 0; i < sessions.length; i++) {
    var s = sessions[i];
    var cls = s.id === activeSessionId ? 'sb-item active' : 'sb-item';
    html += '<div class="' + cls + '" data-id="' + s.id + '" onclick="switchSession(\'' + s.id + '\')">';
    html += '<span class="sb-label">' + esc(s.title) + '</span>';
    html += '<button class="sb-del" onclick="event.stopPropagation();deleteSession(\'' + s.id + '\')" title="删除">&times;</button>';
    html += '</div>';
  }
  list.innerHTML = html;
}

function renderChatMessages() {
  var s = getActiveSession();
  var el = document.getElementById('messages');
  if (!s || s.messages.length === 0) {
    el.innerHTML = '<div class="welcome"><strong>field-memory</strong><br>库选择器在 header &middot; 记忆场可视化在右栏 &middot; 聊天在中栏</div>';
    return;
  }
  el.innerHTML = '';
  for (var i = 0; i < s.messages.length; i++) {
    var m = s.messages[i];
    var div = document.createElement('div');
    div.className = 'message ' + m.role;
    var label = m.role === 'user' ? '你' : 'FM';
    div.innerHTML = '<div class="content">' + esc(m.content) + '</div>' +
      '<div class="meta">' + label + ' &middot; ' + m.time + '</div>';
    // memory context toggle
    if (m.memoryCtx) {
      var toggle = document.createElement('div');
      toggle.className = 'mem-ctx-toggle';
      toggle.textContent = m.memoryCtx.tool_invoked ? '已调用 tool' : '记忆注入详情';
      var detail = document.createElement('div');
      detail.className = 'mem-ctx-detail';
      var h = '';
      if (m.memoryCtx.tool_invoked) h += '<div style="color:var(--accent);font-weight:500">tool 已被模型调用</div>';
      if (m.memoryCtx.system_prompt_line) h += '<div style="margin-top:4px"><span class="label">注入：</span>' + esc(m.memoryCtx.system_prompt_line) + '</div>';
      if (m.memoryCtx.associations && m.memoryCtx.associations.length) {
        h += '<div style="margin-top:4px"><span class="label">关联：</span></div>';
        for (var ai = 0; ai < m.memoryCtx.associations.length; ai++) {
          h += '<div class="item">  ' + esc(m.memoryCtx.associations[ai].label) + ' (' + m.memoryCtx.associations[ai].impact + ')</div>';
        }
      }
      if (m.memoryCtx.recalled_events && m.memoryCtx.recalled_events.length) {
        h += '<div style="margin-top:4px"><span class="label">召回事件：</span></div>';
        for (var ei = 0; ei < m.memoryCtx.recalled_events.length; ei++) {
          h += '<div class="item">  [' + esc(m.memoryCtx.recalled_events[ei].anchor) + '] ' + esc(m.memoryCtx.recalled_events[ei].text) + '</div>';
        }
      }
      detail.innerHTML = h;
      (function(t, d) {
        t.addEventListener('click', function() { t.classList.toggle('open'); d.classList.toggle('open'); });
      })(toggle, detail);
      div.appendChild(toggle);
      div.appendChild(detail);
    }
    el.appendChild(div);
  }
  el.scrollTop = el.scrollHeight;
}

function updateSessionTitle(s) {
  if (s.title !== '新会话') return;
  var first = s.messages.find(function(m) { return m.role === 'user'; });
  if (first) {
    s.title = first.content.length > 16 ? first.content.slice(0, 16) + '...' : first.content;
    renderSessionList();
  }
}

var msgEl = document.getElementById('messages');
var input = document.getElementById('user-input');
var sendBtn = document.getElementById('send-btn');
var modelSelect = document.getElementById('model-select');
var apiKeyInput = document.getElementById('api-key');
var urlInput = document.getElementById('backend-url');

function handleKey(e) {
  // command popover navigation
  if (cmdPopoverOpen) {
    if (e.key === 'ArrowDown') { e.preventDefault(); selectCmdItem(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); selectCmdItem(-1); return; }
    if (e.key === 'Enter' || e.key === 'Tab') {
      e.preventDefault();
      confirmCmdSelection();
      return;
    }
    if (e.key === 'Escape') { e.preventDefault(); closeCmdPopover(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}

// ── Slash command popover ──
var SLASH_COMMANDS = [
  { name: '/seed',    alias: '/s',  desc: '进入记忆构建模式',   args: '[描述]' },
  { name: '/recall',  alias: '/r',  desc: '召回事件',          args: '<文本>' },
  { name: '/associate', alias: '/a', desc: '概念关联',         args: '<文本>' },
  { name: '/status',  alias: '/st', desc: '当前库状态',        args: '' },
  { name: '/save',    alias: '',    desc: '持久化到磁盘',      args: '' },
  { name: '/load',    alias: '',    desc: '从磁盘读取',        args: '' },
  { name: '/help',    alias: '/h',  desc: '显示帮助',          args: '' },
];

var cmdPopoverOpen = false;
var cmdSelectedIndex = -1;
var cmdFiltered = [];

function onInputChange() {
  var val = input.value;
  if (val.indexOf('/') === 0 && val.indexOf(' ') === -1) {
    var query = val.toLowerCase();
    cmdFiltered = SLASH_COMMANDS.filter(function(c) {
      return c.name.indexOf(query) === 0 || (c.alias && c.alias.indexOf(query) === 0);
    });
    if (cmdFiltered.length > 0) {
      showCmdPopover(cmdFiltered);
      return;
    }
  }
  closeCmdPopover();
}

function showCmdPopover(items) {
  var popover = document.getElementById('cmd-popover');
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var c = items[i];
    var sel = i === 0 ? ' selected' : '';
    html += '<div class="cmd-item' + sel + '" data-index="' + i + '" onmousedown="event.preventDefault();cmdSelectedIndex=' + i + ';confirmCmdSelection()">';
    html += '<span class="cmd-name">' + c.name + '</span>';
    if (c.alias) html += '<span class="cmd-alias">' + c.alias + '</span>';
    html += '<span class="cmd-desc">' + c.desc + '</span>';
    html += '</div>';
  }
  popover.innerHTML = html;
  popover.classList.add('open');
  cmdPopoverOpen = true;
  cmdSelectedIndex = 0;
}

function closeCmdPopover() {
  var popover = document.getElementById('cmd-popover');
  popover.classList.remove('open');
  cmdPopoverOpen = false;
  cmdSelectedIndex = -1;
}

function selectCmdItem(delta) {
  if (!cmdFiltered.length) return;
  cmdSelectedIndex = (cmdSelectedIndex + delta + cmdFiltered.length) % cmdFiltered.length;
  var items = document.querySelectorAll('#cmd-popover .cmd-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('selected', i === cmdSelectedIndex);
  }
}

function confirmCmdSelection() {
  if (cmdSelectedIndex < 0 || cmdSelectedIndex >= cmdFiltered.length) return;
  var c = cmdFiltered[cmdSelectedIndex];
  input.value = c.name + ' ';
  closeCmdPopover();
  input.focus();
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(fetchStatus, 1500);
  fetchStatus();
}

// ── Library management ──
async function loadLibraryList() {
  try {
    var resp = await fetch('/api/memory/libraries');
    var data = await resp.json();
    currentLibrary = data.active || 'default';
    var sel = document.getElementById('lib-select');
    sel.innerHTML = '';
    var opt = document.createElement('option');
    opt.value = currentLibrary;
    opt.textContent = currentLibrary + ' (active)';
    sel.appendChild(opt);
    for (var i = 0; i < data.libraries.length; i++) {
      var l = data.libraries[i];
      if (l.name === currentLibrary) continue;
      var o2 = document.createElement('option');
      o2.value = l.name;
      o2.textContent = l.name + ' (' + l.anchors_count + '锚点)';
      sel.appendChild(o2);
    }
  } catch(e) {}
}

async function onLibraryChange(name) {
  if (!name || name === currentLibrary) return;
  // "currentLibrary (active)" is not a real name
  if (name.indexOf(' (active)') > 0) name = name.split(' (')[0];
  try {
    var resp = await fetch('/api/memory/library/load', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name }),
    });
    var data = await resp.json();
    if (data.ok) {
      addMessageToSession('assistant', '已切换到记忆库: ' + data.name + ' (' + data.anchors_count + ' 锚点, ' + data.events_count + ' 事件)');
      currentLibrary = data.name;
      await loadLibraryList();
      fetchStatus();
    } else {

  if (!confirm('删除记忆库 "' + name + '" ?')) return;

    var resp = await fetch('/api/memory/library/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name }),

// ── Field visualization ──
function renderFieldViz(anchors, tension) {
  var canvas = document.getElementById('field-canvas');
  if (!canvas) return;
  var w = canvas.width = canvas.clientWidth;
  var h = canvas.height = canvas.clientHeight;
  var ctx = canvas.getContext('2d');

  // Trigger particles when new events appear (we'll just animate by recent count change)
  if (anchors.length > lastAnchorCount) {
    for (var i = 0; i < Math.min(8, anchors.length - lastAnchorCount); i++) {
      fieldParticles.push({
        x: w / 2 + (Math.random() - 0.5) * 20,
        y: h / 2 + (Math.random() - 0.5) * 20,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        life: 1.0,
      });
    }
  }
  lastAnchorCount = anchors.length;

  // Background: field tension as radial gradient
  ctx.fillStyle = '#0e1116';
  ctx.fillRect(0, 0, w, h);
  var tnorm = Math.min(tension / 30, 1);
  var grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.min(w, h) * 0.55);
  grad.addColorStop(0, 'rgba(74, 111, 165, ' + (0.1 + tnorm * 0.4) + ')');
  grad.addColorStop(1, 'rgba(14, 17, 22, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // Grid (subtle)
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (var i = 0; i < w; i += 30) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke();
  }
  for (var j = 0; j < h; j += 30) {
    ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(w, j); ctx.stroke();
  }

  // Compute positions
  var cx = w / 2, cy = h / 2, scale = Math.min(w, h) * 0.36;
  var positions = anchors.map(function(a) {
    return {
      x: cx + a.direction_xy[0] * scale,
      y: cy - a.direction_xy[1] * scale,
      a: a,
    };
  });

  // Draw connections (cosine > 0.5)
  for (var i = 0; i < positions.length; i++) {
    for (var k = i + 1; k < positions.length; k++) {
      var a = positions[i].a, b = positions[k].a;
      var dot = a.direction_xy[0] * b.direction_xy[0] + a.direction_xy[1] * b.direction_xy[1];
      if (dot > 0.5) {
        var alpha = (dot - 0.5) * 0.5;
        ctx.strokeStyle = 'rgba(74, 111, 165, ' + alpha + ')';
        ctx.lineWidth = dot * 1.5;
        ctx.beginPath();
        ctx.moveTo(positions[i].x, positions[i].y);
        ctx.lineTo(positions[k].x, positions[k].y);
        ctx.stroke();
      }
    }
  }

  // Draw anchors
  for (var p of positions) {
    var d = p.a.density;
    var layer = d > 15 ? 'L1' : d > 8 ? 'L2' : d > 3 ? 'L3' : 'L4';
    var colors = { L1: '#ff6b6b', L2: '#ffa94d', L3: '#ffd43b', L4: '#74c0fc' };
    var color = colors[layer];
    var size = Math.sqrt(d) * 3 + 5;

    // Outer glow
    var g2 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 3);
    g2.addColorStop(0, color);
    g2.addColorStop(0.3, color.replace(')', ', 0.3)').replace('rgb', 'rgba'));
    g2.addColorStop(1, 'transparent');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size * 3, 0, Math.PI * 2);
    ctx.fill();

    // Solid core
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fill();

    // White core
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, size * 0.4, 0, Math.PI * 2);
    ctx.fill();

    // Label
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.a.label, p.x, p.y + size + 12);
  }

  // Animate & draw particles
  fieldParticles = fieldParticles.filter(function(p) { return p.life > 0; });
  for (var particle of fieldParticles) {
    particle.x += particle.vx;
    particle.y += particle.vy;
    particle.life -= 0.02;
    ctx.fillStyle = 'rgba(255, 200, 100, ' + particle.life + ')';
    ctx.beginPath();
    ctx.arc(particle.x, particle.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Chat ──
async function send() {
  var text = input.value.trim();
  if (!text || isStreaming) return;
  input.value = ''; input.style.height = 'auto';
  closeCmdPopover();
  isStreaming = true; sendBtn.disabled = true;

  var s = getActiveSession();
  if (!s) return;

  var welcome = msgEl.querySelector('.welcome');
  if (welcome) welcome.remove();

  // Slash commands
  if (text.indexOf('/') === 0) {
    var parts = text.split(/\s+/);
    var cmdName = parts[0].slice(1).toLowerCase();
    if (cmdName === 'seed' || cmdName === 's') { await handleSeedCommand(parts.slice(1)); isStreaming = false; sendBtn.disabled = false; input.focus(); return; }
    if (cmdName === 'recall' || cmdName === 'r') { await handleQueryCommand(parts.slice(1).join(' '), 'recall'); isStreaming = false; sendBtn.disabled = false; input.focus(); return; }
    if (cmdName === 'associate' || cmdName === 'a') { await handleQueryCommand(parts.slice(1).join(' '), 'associate'); isStreaming = false; sendBtn.disabled = false; input.focus(); return; }
    if (cmdName === 'save') { await saveMem(); isStreaming = false; sendBtn.disabled = false; input.focus(); return; }
    if (cmdName === 'load') { await loadMem(); isStreaming = false; sendBtn.disabled = false; input.focus(); return; }
    if (cmdName === 'status' || cmdName === 'st') { await showStatusInline(); isStreaming = false; sendBtn.disabled = false; input.focus(); return; }
    if (cmdName === 'help' || cmdName === 'h' || cmdName === '?') { showHelp(); isStreaming = false; sendBtn.disabled = false; input.focus(); return; }
    addMessageToSession('assistant', '未知命令: ' + parts[0] + '。输入 /help 查看命令。');
    isStreaming = false; sendBtn.disabled = false; input.focus();
    return;
  }

  var time = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  s.messages.push({ role: 'user', content: text, time: time });
  updateSessionTitle(s);
  appendChatBubble('user', text, time);

  var time2 = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  s.messages.push({ role: 'assistant', content: '', time: time2, memoryCtx: null });
  var assistantDiv = appendChatBubble('assistant', '...', time2);
  assistantDiv.classList.add('typing');
  var contentEl = assistantDiv.querySelector('.content');
  contentEl.textContent = '...';

  var baseUrl = urlInput.value.replace(/\/$/, '');
  var apiMessages = s.messages.filter(function(m) { return m.role === 'user' || m.role === 'assistant'; }).map(function(m) {
    return { role: m.role, content: m.content };
  });
  try {
    var resp = await fetch(baseUrl + '/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKeyInput.value },
      body: JSON.stringify({ messages: apiMessages, model: modelSelect.value, stream: true }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    assistantDiv.classList.remove('typing');
    var fullText = '', memoryCtx = null, reader = resp.body.getReader(), decoder = new TextDecoder(), buffer = '';
    while (true) {
      var result = await reader.read();
      if (result.done) break;
      buffer += decoder.decode(result.value, { stream: true });
      var lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (var j = 0; j < lines.length; j++) {
        var line = lines[j].trim();
        if (line.indexOf('data: ') !== 0) continue;
        var data = line.slice(6);
        if (data === '[DONE]') break;
        if (data.indexOf('__MEMORY__') === 0) {
          try { memoryCtx = JSON.parse(data.slice(10)); } catch(e) {}
          continue;
        }
        fullText += data;
        contentEl.textContent = fullText;
        msgEl.scrollTop = msgEl.scrollHeight;
      }
    }
    // update session data
    var lastAssistant = s.messages[s.messages.length - 1];
    lastAssistant.content = fullText;
    lastAssistant.memoryCtx = memoryCtx;
    contentEl.textContent = fullText;
    if (memoryCtx) renderMemoryCtx(assistantDiv, memoryCtx);
    if (memoryCtx && memoryCtx.tool_invoked) fetchStatus();
  } catch (e) {
    assistantDiv.classList.remove('typing');
    contentEl.textContent = '错误: ' + e.message;
    var lastAssistant2 = s.messages[s.messages.length - 1];
    lastAssistant2.content = '错误: ' + e.message;
  }
  isStreaming = false; sendBtn.disabled = false; input.focus();
}

function appendChatBubble(role, content, time) {
  var div = document.createElement('div');
  div.className = 'message ' + role;
  var label = role === 'user' ? '你' : 'FM';
  div.innerHTML = '<div class="content">' + esc(content) + '</div>' +
    '<div class="meta">' + label + ' &middot; ' + (time || new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})) + '</div>';
  msgEl.appendChild(div);
  msgEl.scrollTop = msgEl.scrollHeight;
  return div;
}

function addMessageToSession(role, content) {
  var s = getActiveSession();
  if (!s) return;
  var time = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  s.messages.push({ role: role, content: content, time: time });
  appendChatBubble(role, content, time);
  updateSessionTitle(s);
}

async function handleSeedCommand(args) {
  var userDesc = args.length > 0 ? args.join(' ') : '';
  var seedPrompt = '【记忆构建模式】你现在是记忆构建助手。请通过对话了解我的知识结构、经验偏好和核心原则，然后逐步调用 seed_memory tool 来构建记忆库。\n' +
    '建议流程：\n' +
    '1. 先通过提问了解我的背景\n' +
    '2. 每次了解一批概念后调用一次 seed_memory\n' +
    '3. 继续提问、继续注入，直到记忆库完整\n';
  if (userDesc) seedPrompt += '\n初始信息：' + userDesc + '\n请在此基础上开始提问。';

  var s = getActiveSession();
  if (!s) return;
  var time = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  s.messages.push({ role: 'user', content: '/' + (args.length > 0 ? 'seed ' + userDesc : 'seed'), time: time });
  appendChatBubble('user', '/' + (args.length > 0 ? 'seed ' + userDesc : 'seed'), time);
  updateSessionTitle(s);

  var time2 = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  s.messages.push({ role: 'assistant', content: '', time: time2, memoryCtx: null });
  var assistantDiv = appendChatBubble('assistant', '...', time2);
  assistantDiv.classList.add('typing');
  var contentEl = assistantDiv.querySelector('.content');
  contentEl.textContent = '...';

  var baseUrl = urlInput.value.replace(/\/$/, '');
  var apiMessages = [{ role: 'user', content: seedPrompt }];
  try {
    var resp = await fetch(baseUrl + '/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKeyInput.value },
      body: JSON.stringify({ messages: apiMessages, model: modelSelect.value, stream: true }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    assistantDiv.classList.remove('typing');
    var fullText = '', memoryCtx = null, reader = resp.body.getReader(), decoder = new TextDecoder(), buffer = '';
    while (true) {
      var result = await reader.read();
      if (result.done) break;
      buffer += decoder.decode(result.value, { stream: true });
      var lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (var j = 0; j < lines.length; j++) {
        var line = lines[j].trim();
        if (line.indexOf('data: ') !== 0) continue;
        var data = line.slice(6);
        if (data === '[DONE]') break;
        if (data.indexOf('__MEMORY__') === 0) {
          try { memoryCtx = JSON.parse(data.slice(10)); } catch(e) {}
          continue;
        }
        fullText += data;
        contentEl.textContent = fullText;
        msgEl.scrollTop = msgEl.scrollHeight;
      }
    }
    var lastAssistant = s.messages[s.messages.length - 1];
    lastAssistant.content = fullText;
    lastAssistant.memoryCtx = memoryCtx;
    contentEl.textContent = fullText;
    if (memoryCtx) renderMemoryCtx(assistantDiv, memoryCtx);
    if (memoryCtx && memoryCtx.tool_invoked) fetchStatus();
  } catch (e) {
    assistantDiv.classList.remove('typing');
    contentEl.textContent = '错误: ' + e.message;
    var lastAssistant2 = s.messages[s.messages.length - 1];
    lastAssistant2.content = '错误: ' + e.message;
  }
  isStreaming = false; sendBtn.disabled = false; input.focus();
}

async function handleQueryCommand(query, mode) {
  if (!query) {
    addMessageToSession('assistant', '用法: /' + mode + ' <查询文本>');
    return;
  }
  var msg = appendChatBubble('assistant', '正在查询...', new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  msg.querySelector('.content').textContent = mode + ': ' + query;
  try {
    var resp = await fetch('/api/memory/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: query, mode: mode, top_k: 5 }),
    });
    var data = await resp.json();
    var result = '';
    if (data.associated_anchors && data.associated_anchors.length > 0) {
      result += '关联锚点:\n';
      for (var i = 0; i < data.associated_anchors.length; i++) {
        var a = data.associated_anchors[i];
        result += '  [' + a.label + '] density=' + a.density + ' impact=' + a.impact + '\n';
      }
    }
    if (data.recalled_events && data.recalled_events.length > 0) {
      result += '召回事件:\n';
      for (var i = 0; i < data.recalled_events.length; i++) {
        var e = data.recalled_events[i];
        result += '  [' + e.anchor + '] ' + e.text + '\n';
      }
    }
    if (!result) result = '(无结果)';
    msg.querySelector('.content').textContent = result;
    var s = getActiveSession();
    if (s) s.messages.push({ role: 'assistant', content: result, time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) });
  } catch (e) {
    msg.querySelector('.content').textContent = '查询失败: ' + e.message;
    var s2 = getActiveSession();
    if (s2) s2.messages.push({ role: 'assistant', content: '查询失败: ' + e.message, time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) });
  }
}

async function showStatusInline() {
  try {
    var resp = await fetch('/api/memory/status');
    var data = await resp.json();
    var anchors = data.anchors || [];
    var lines = [];
    lines.push('库: ' + currentLibrary);
    lines.push('锚点: ' + data.anchors_count + ' | 事件: ' + data.events_count + ' | 痕迹: ' + data.traces_count + ' | 种子: ' + data.seeds_count);
    if (data.ecg) lines.push('张力: ' + data.ecg.field_tension.toFixed(4));
    for (var i = 0; i < Math.min(anchors.length, 8); i++) {
      lines.push('  ' + anchors[i].label + ' (d=' + anchors[i].density + ')');
    }
    addMessageToSession('assistant', lines.join('\n'));
  } catch (e) { addMessageToSession('assistant', '获取状态失败: ' + e.message); }
}

function showHelp() {
  var h = '可用命令:\n' +
    '  /seed [描述]              进入记忆构建模式（唤起 LLM）\n' +
    '  /recall <文本>             召回事件（别名: /r）\n' +
    '  /associate <文本>          概念关联（别名: /a）\n' +
    '  /status                   当前库状态（别名: /st）\n' +
    '  /save / /load             持久化到磁盘\n' +
    '  /help                     显示帮助\n\n' +
    '记忆库管理: 点 header 的"管理"按钮';
  addMessageToSession('assistant', h);
}


async function saveMem() {
  try {
    var resp = await fetch('/api/memory/save', { method: 'POST' });
    var data = await resp.json();
    addMessageToSession('assistant', data.ok ? '记忆已保存到磁盘。' : '保存失败：' + (data.error || '未知错误'));
    fetchStatus();
  } catch(e) { addMessageToSession('assistant', '保存失败：' + e.message); }
}
async function loadMem() {
  try {
    var resp = await fetch('/api/memory/load', { method: 'POST' });
    var data = await resp.json();
    if (data.ok) addMessageToSession('assistant', '已读取 ' + data.anchors_count + ' 锚点、' + data.events_count + ' 事件。');
    else addMessageToSession('assistant', '读取失败：' + (data.error || ''));
    fetchStatus();
  } catch(e) {}
}

// Init
createSession();
loadLibraryList();
startPolling();
</script>
