<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>field-memory chat</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #f5f4f0; --surface: #fff; --text: #1a1a1a; --text-muted: #6b6b6b;
  --user-bubble: #e8edf4; --border: #e0ddd8; --font: -apple-system, system-ui, sans-serif;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
header { flex-shrink:0; padding:10px 20px; border-bottom:1px solid var(--border); background:var(--surface); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
header h1 { font-size:14px; font-weight:600; margin-right:auto; }
header select, header input { font-size:12px; padding:4px 8px; border:1px solid var(--border); border-radius:6px; background:var(--surface); font-family:var(--font); }
header input { width:200px; }
#messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; }
.message { display:flex; flex-direction:column; max-width:72%; animation:fadeIn .2s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.message.user { align-self:flex-end; }
.message.assistant { align-self:flex-start; }
.message .content { padding:10px 14px; border-radius:10px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.message.user .content { background:var(--user-bubble); color:var(--text); border-bottom-right-radius:3px; }
.message.assistant .content { background:transparent; color:var(--text); padding-left:0; }
.message .meta { font-size:10px; color:var(--text-muted); margin-top:3px; padding:0 3px; }
.message.user .meta { text-align:right; }
.typing .content { color:var(--text-muted) !important; }
#input-area { flex-shrink:0; padding:14px 20px 20px; background:var(--surface); border-top:1px solid var(--border); display:flex; gap:8px; align-items:flex-end; }
#input-area textarea { flex:1; resize:none; border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-size:14px; font-family:var(--font); line-height:1.5; background:var(--surface); color:var(--text); outline:none; transition:border-color .15s; }
#input-area textarea:focus { border-color:#888; }
#input-area button { width:36px; height:36px; border-radius:8px; border:none; background:#1a1a1a; color:#fff; cursor:pointer; font-size:13px; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:opacity .15s; }
#input-area button:hover { opacity:.85; }
#input-area button:disabled { opacity:.4; cursor:default; }
.welcome { align-self:center; text-align:center; color:var(--text-muted); margin-top:10vh; font-size:13px; line-height:1.8; }
.welcome strong { color:var(--text); font-weight:500; }

/* === memory panel === */
#memory-panel {
  position: fixed;
  right: 0;
  top: 53px;
  bottom: 0;
  width: 280px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  padding: 14px;
  overflow-y: auto;
  font-size: 12px;
  z-index: 100;
  display: none;
}
#memory-panel h3 {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.mem-section { margin-bottom: 16px; }
.mem-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
}
.mem-row .label { color: var(--text-muted); }
.mem-row .value { font-weight: 500; }
.mem-anchor-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 0;
}
.mem-anchor-label {
  flex-shrink: 0;
  min-width: 60px;
  max-width: 80px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mem-density-bar {
  flex: 1;
  height: 6px;
  background: var(--bg);
  border-radius: 3px;
  overflow: hidden;
}
.mem-density-fill {
  height: 100%;
  background: #6b6b6b;
  border-radius: 3px;
  transition: width .3s ease;
}
.mem-density-value {
  flex-shrink: 0;
  width: 40px;
  text-align: right;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.mem-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.mem-actions button {
  font-size: 11px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}
.mem-actions button:hover { background: var(--bg); }
.mem-not-available {
  color: var(--text-muted);
  font-size: 12px;
  text-align: center;
  padding: 40px 0;
  line-height: 1.6;
}

body.mem-active #messages,
body.mem-active #input-area {
  margin-right: 280px;
}

@media (max-width: 800px) {
  body.mem-active #messages,
  body.mem-active #input-area { margin-right: 0; }
  #memory-panel { display: none !important; }
}
</style>
</head>
<body>

<header>
  <h1>field-memory</h1>
  <select id="model-select">
    <option value="test-model-1">test-model-1</option>
    <option value="test-model-2">test-model-2</option>
  </select>
  <input id="api-key" type="password" placeholder="api key (sk-fm)" value="sk-fm">
  <input id="backend-url" type="text" placeholder="base url" value="http://127.0.0.1:4000">
</header>

<div id="memory-panel">
  <div id="mem-content"><div class="mem-not-available">loading&hellip;</div></div>
</div>

<div id="messages">
  <div class="welcome">
    <strong>field-memory chat</strong><br>
    testing field-memory on your own LLM backend
  </div>
</div>

<div id="input-area">
  <textarea id="user-input" rows="1" placeholder="type a message..." onkeydown="handleKey(event)"></textarea>
  <button id="send-btn" onclick="send()">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="2" y1="8" x2="14" y2="8"/>
      <polyline points="10,4 14,8 10,12"/>
    </svg>
  </button>
</div>

<script>
let messages = [];
let isStreaming = false;
const msgEl = document.getElementById('messages');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const modelSelect = document.getElementById('model-select');
const apiKeyInput = document.getElementById('api-key');
const urlInput = document.getElementById('backend-url');

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}

async function send() {
  const text = input.value.trim();
  if (!text || isStreaming) return;
  input.value = ''; input.style.height = 'auto';
  isStreaming = true; sendBtn.disabled = true;

  const welcome = msgEl.querySelector('.welcome');
  if (welcome) welcome.remove();

  addMessage('user', text);
  messages.push({ role: 'user', content: text });

  const assistantDiv = addMessage('assistant', '');
  assistantDiv.classList.add('typing');
  const contentEl = assistantDiv.querySelector('.content');
  contentEl.textContent = '...';

  const baseUrl = urlInput.value.replace(/\/$/, '');
  try {
    const resp = await fetch(baseUrl + '/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKeyInput.value,
      },
      body: JSON.stringify({ messages, model: modelSelect.value, stream: true }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);

    assistantDiv.classList.remove('typing');
    let fullText = '';
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data: ')) continue;
        const data = t.slice(6);
        if (data === '[DONE]') break;
        fullText += data;
        contentEl.textContent = fullText;
        msgEl.scrollTop = msgEl.scrollHeight;
      }
    }
    messages.push({ role: 'assistant', content: fullText });
  } catch (e) {
    assistantDiv.classList.remove('typing');
    contentEl.textContent = 'Error: ' + e.message;
  }
  isStreaming = false; sendBtn.disabled = false; input.focus();
  updateMemoryPanel();
}

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.innerHTML = '<div class="content">' + esc(content) + '</div><div class="meta">' + (role==='user'?'you':'fm') + ' &middot; ' + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) + '</div>';
  msgEl.appendChild(div);
  msgEl.scrollTop = msgEl.scrollHeight;
  return div;
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// === memory panel ===
async function updateMemoryPanel() {
  const panel = document.getElementById('memory-panel');
  const content = document.getElementById('mem-content');
  try {
    const resp = await fetch('/api/memory/status');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    renderMemoryPanel(data);
    document.body.classList.add('mem-active');
    panel.style.display = '';
  } catch (e) {
    document.body.classList.remove('mem-active');
    panel.style.display = '';
    content.innerHTML = '<div class="mem-not-available">memory backend<br>not available</div>';
    setTimeout(function () { panel.style.display = 'none'; }, 4000);
  }
}

function renderMemoryPanel(data) {
  const ecg = data.ecg || {};
  const anchors = data.anchors || [];
  const maxDensity = anchors.length > 0 ? Math.max.apply(null, anchors.map(function (a) { return a.density; })) : 1;
  let html = '';

  // ECG
  html += '<div class="mem-section"><h3>ECG</h3>';
  html += '<div class="mem-row"><span class="label">tension</span><span class="value">' + (ecg.field_tension != null ? Number(ecg.field_tension).toFixed(4) : '---') + '</span></div>';
  html += '<div class="mem-row"><span class="label">convergence</span><span class="value">' + (ecg.convergence_rate != null ? Number(ecg.convergence_rate).toFixed(4) : '---') + '</span></div>';
  html += '<div class="mem-row"><span class="label">anisotropy</span><span class="value">' + (ecg.anisotropy_magnitude != null ? Number(ecg.anisotropy_magnitude).toFixed(4) : '---') + '</span></div>';
  html += '</div>';

  // Stats
  html += '<div class="mem-section"><h3>Stats</h3>';
  html += '<div class="mem-row"><span class="label">anchors</span><span class="value">' + anchors.length + '</span></div>';
  html += '<div class="mem-row"><span class="label">events</span><span class="value">' + (data.events_count || 0) + '</span></div>';
  html += '<div class="mem-row"><span class="label">seeds</span><span class="value">' + (data.seeds_count || 0) + '</span></div>';
  html += '</div>';

  // Anchors list (max 15)
  if (anchors.length > 0) {
    html += '<div class="mem-section"><h3>Anchors</h3>';
    for (let i = 0; i < Math.min(anchors.length, 15); i++) {
      const a = anchors[i];
      const pct = (a.density / maxDensity * 100).toFixed(0);
      html += '<div class="mem-anchor-item">';
      html += '<span class="mem-anchor-label">' + esc(a.label) + '</span>';
      html += '<div class="mem-density-bar"><div class="mem-density-fill" style="width:' + pct + '%"></div></div>';
      html += '<span class="mem-density-value">' + Number(a.density).toFixed(2) + '</span>';
      html += '</div>';
    }
    html += '</div>';
  }

  // Actions
  html += '<div class="mem-section"><h3>Actions</h3>';
  html += '<div class="mem-actions">';
  html += '<button onclick="saveMemory()">save</button>';
  html += '<button onclick="loadMemory()">load</button>';
  html += '<button onclick="initMemory()">init</button>';
  html += '</div></div>';

  document.getElementById('mem-content').innerHTML = html;
}

async function saveMemory() {
  try {
    await fetch('/api/memory/save', { method: 'POST' });
  } catch (e) { console.error('save failed', e); }
}

async function loadMemory() {
  try {
    await fetch('/api/memory/load', { method: 'POST' });
    await updateMemoryPanel();
  } catch (e) { console.error('load failed', e); }
}

function initMemory() {
  const raw = prompt('Enter concepts (label:density), one per line:\ne.g.\ngreeting:1.0\nsyntax:0.8');
  if (!raw) return;
  const concepts = raw.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s; }).map(function (s) {
    const parts = s.split(':');
    return { label: (parts[0] || '').trim(), density: parseFloat(parts[1]) || 1.0 };
  });
  if (concepts.length === 0) return;
  fetch('/api/memory/init', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ concepts: concepts })
  }).then(updateMemoryPanel).catch(function (e) { console.error('init failed', e); });
}

// Load memory panel on page load
updateMemoryPanel();
</script>
</body>
</html>
