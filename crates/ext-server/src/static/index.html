<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>field-memory 控制台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>field-memory</h1>
  <select id="lib-select" onchange="onLibraryChange(this.value)"></select>
  <button class="hdr-btn" onclick="showLibraryDialog()">管理</button>
  <select id="model-select"><option>test-model-1</option><option>test-model-2</option></select>
  <input id="api-key" type="password" placeholder="API Key" value="sk-fm">
  <input id="backend-url" type="text" placeholder="代理地址" value="http://127.0.0.1:5100">
</header>

<div id="columns">

  <!-- session sidebar -->
  <div id="session-sidebar" class="collapsible">
    <div class="sb-header">
      <h3>会话</h3>
      <button class="sb-new" onclick="createSession()" title="新会话">+</button>
    </div>
    <div id="session-list"></div>
  </div>

  <!-- core params panel -->
  <div id="panel-core" class="collapsible"></div>

  <!-- chat -->
  <div id="panel-chat">
    <div id="messages"></div>
    <div id="input-area">
      <textarea id="user-input" rows="1" placeholder="输入消息，/ 查看命令…"></textarea>
      <button id="send-btn" onclick="send()">↑</button>
      <div class="cmd-popover" id="cmd-popover"></div>
    </div>
  </div>

  <!-- memory panel -->
  <div id="panel-mem" class="collapsible"></div>

  <!-- toggle buttons — outside collapsible panels so they stay visible when collapsed -->
  <button class="panel-toggle" id="toggle-sessionSidebar" data-panel="sessionSidebar" data-dir="left" title="折叠会话列表">‹</button>
  <button class="panel-toggle" id="toggle-panelCore" data-panel="panelCore" data-dir="left" title="折叠引擎参数">‹</button>
  <button class="panel-toggle" id="toggle-panelMem" data-panel="panelMem" data-dir="right" title="折叠记忆面板">›</button>

</div>

<script src="app.js"></script>
</body>
</html>
